# Builds the report PDF on each push to main and each pull request; the run's page lists it under Artifacts.
# The same runs also fail on a file path in the Markdown docs that doesn't exist.
# A pushed delivery-* tag also attaches the PDF to a release of that tag.
name: Report

on:
  push:
    branches: [main]
    tags: ['delivery-*']
  pull_request:
  workflow_dispatch:

jobs:
  paths:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: .agents/skills/consistency-check/check.sh --paths

  pdf:
    runs-on: ubuntu-24.04
    env:
      TEX_PACKAGES: lmodern texlive-xetex texlive-latex-extra texlive-pictures texlive-fonts-recommended
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags and the history to them, for the version report/version.lua prints
      # The release's static binary; installing its .deb spent ~25 s in apt and dpkg.
      - name: Install pandoc
        run: gh release download 3.13 --repo jgm/pandoc --pattern '*linux-amd64.tar.gz' --output - | sudo tar -xz -C /usr/local/bin --strip-components 2 pandoc-3.13/bin/pandoc
        env:
          GH_TOKEN: ${{ github.token }}
      # Installing takes about a minute, most of it tex-common building every TeX format,
      # so the first run tars the installed files and the formats, and later runs untar them.
      - id: tex
        uses: actions/cache@v6
        with:
          path: tex.tar
          # Bump v1 to pick up newer Ubuntu TeX packages.
          key: tex-ubuntu-24.04-v1-${{ env.TEX_PACKAGES }}
      - name: Install xelatex and the LaTeX packages the report uses
        if: steps.tex.outputs.cache-hit != 'true'
        run: |
          dpkg-query -W -f '${Package}\n' | sort > "$RUNNER_TEMP/before"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $TEX_PACKAGES
          dpkg-query -W -f '${Package}\n' | sort | comm -13 "$RUNNER_TEMP/before" - | xargs dpkg -L \
            | while read -r f; do if [ -f "$f" ] || [ -L "$f" ]; then echo "$f"; fi; done > "$RUNNER_TEMP/files"
          # The formats, ls-R and updmap's maps are made by the install's triggers, so dpkg -L doesn't list them.
          sudo tar -cf tex.tar -T "$RUNNER_TEMP/files" /var/lib/texmf /etc/texmf
      - name: Restore xelatex from the cache
        if: steps.tex.outputs.cache-hit == 'true'
        run: sudo tar -xf tex.tar -C / && sudo ldconfig && fc-cache
      - id: pdf
        name: Build the report
        run: |
          # On a tag the file is the tag's name, the same name the release is published under.
          # Otherwise it is the version the title page prints.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            version=$(git describe --tags --always --dirty)
          fi
          pandoc -d report/pandoc.yaml -o "report/${version}.pdf"
          echo "filename=${version}.pdf" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pdf.outputs.filename }}
          path: report/${{ steps.pdf.outputs.filename }}
          archive: false
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/delivery-')
    needs: pdf
    runs-on: ubuntu-24.04
    # Only this job writes, so the build's actions never hold a write token.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ github.ref_name }}.pdf
      - run: gh release create "$GITHUB_REF_NAME" ./*.pdf --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
