# Builds the report. Pass -o so the PDF is named with the version on the title page,
# which is the tag on a tagged commit:
#   pandoc -d report/pandoc.yaml -o "report/$(git describe --tags --always --dirty).pdf"
# Sections are concatenated in this order; a new section file goes here.
input-files:
  - ${.}/0-revision-history.md
  - ${.}/1-application-requirements.md
  - ${.}/2-system-operations.md
  - ${.}/3-services.md
  - ${.}/4a-service-apis-rest.md
  - ${.}/4b-service-apis-messaging.md
  - ${.}/5-open-points.md
  - ${.}/9-references-and-appendix.md
pdf-engine: xelatex
filters:
  - ${.}/version.lua
citeproc: true
bibliography: ${.}/references.bib
include-in-header: ${.}/preamble.tex
number-sections: true
table-of-contents: true
metadata:
  title: Places
  subtitle: "Group 5 — the Places subsystem of the Event Management system"
  author:
    - Alef Keuffer
    - Daniella De Leon
    - Al Mahmud Sarker
    - Sergio Miguel Cardoso Almeida
    - Afonso da Cruz Pimenta
  date: "DevOps and Cloud Computing — DCN Delivery 1 — 18 November 2026"
  link-citations: true
variables:
  classoption: titlepage
  geometry: margin=2.5cm
  colorlinks: true
